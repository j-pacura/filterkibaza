[build]
  # Katalog bazowy - tu znajduje się aplikacja React
  base = "filterkibaza-web"

  # Komenda budowania - najpierw TypeScript, potem Vite
  command = "npm install && npm run build"

  # Katalog publikacji - Vite domyślnie buduje do dist/
  publish = "filterkibaza-web/dist"

# Przekierowania dla React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Nagłówki bezpieczeństwa
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache dla statycznych assetów
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
